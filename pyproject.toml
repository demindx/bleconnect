[project]
name = "bleconnect"
version = "0.1.0"
description = "Bluetooth clipboard and file sharing between Android and Linux"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
linux = ["dbus-next>=0.2.3"]

[project.scripts]
bleconnect = "bleconnect:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
